# 2026-09-20：runner 从 macos-15 换成 **ubuntu-22.04**，与上游对齐。
#
#   起因是先在 Mac 本机直接出包，结果查明**本机环境会系统性破坏 autotools**：
#   宿主为每个 bash 子进程 source 一个 BASH_ENV 脚本，它做两件事 ——
#     · brokered-sandbox-bash-env.sh:9   export PATH="${CODEBUDDY_BROKERED_BIN_DIR}:$PATH"
#     · safe-delete-bash-env.sh:4-7      rm() { "<safe-delete-bin>/rm" "$@"; }; export -f rm
#   于是 configure 探到的是 shim 版的 sed / grep / dd，fribidi 当场死在
#   `sed: bad pattern '.tmp'@2 (t)`（那个 `@2 (t)` 尾巴不是 sed 的报错格式，是 shim 的注解），
#   rm 也变成会拒绝删除的包装器（`rm: confNNNNN.dir/confNNNNN.file: Operation not permitted`）。
#   这是宿主层面的、绕起来很脆；而且 macOS 上 NDK 只提供 darwin-x86_64 host，
#   整个构建跑在 Rosetta 下。
#
#   ⇒ 回到上游唯一验证过的平台：ubuntu-22.04 + 原生 x86_64。
#     上游所有的 Android workflow 都在 ubuntu-22.04（android-build-scripts.yml 与
#     periodic-builds-android.yml 的每一个 job 都是）。
#
# ⚠️ 2026-09-20 纠正：**上述两份 upstream workflow 都不是我们配方的依据。**
#    · 产出我们手上那份现役 AAR 的 workflow **不在本仓历史里** —— 它的 runner 路径是
#      /home/runner/work/ffmpeg-kit-16KB/ffmpeg-kit-16KB/，而本仓是 andy380743909/ffmpeg-kit。
#    · 本仓历史里能找到的两份（android-full-gpl-patched.yml、android-build-scripts-16kb.yml，
#      作者 Tamim Hossain）都是 **r28b + `-d`**，且后者连 `--full` 都没有 —— 与现役产物对不上。
#      此前把它们当基线，因而继承了两个本不该有的变量（NDK r28b、`-d`）。
#    · **真正的配方写死在产物自己身上**：现役 AAR 的 .so 里嵌着完整 configure 串，据此得到的
#      既成事实是：ubuntu + NDK r27d（解在 `<repo>/.ndk/` 下）+ API 23 +
#      `--lts --full --enable-gpl --enable-android-media-codec --enable-android-zlib` +
#      `--disable-debug --enable-lto`（= 没有 `-d`）+ `--enable-sdl2` + `--enable-libsrt`。
#      逐字片段：`--cc=aarch64-linux-android23-clang`、
#      `--sysroot=/home/runner/work/ffmpeg-kit-16KB/ffmpeg-kit-16KB/.ndk/android-ndk-r27d/...`。
#    · 本次按这条既成事实对齐，只保留**一处**刻意差异：`--disable-lib-sdl`（现役那份是
#      `--enable-sdl2`，代价见下面 FLAGS 处）。
#
# 构建配方：`./android.sh` flags + ANDROID_PATCH_ROOT(patches/android-apply-patches.sh，
# 由 android.sh:218-220 调用) + libc++ 16KB relink（也在 android.sh 内）+ Gradle AAR。
# 本仓树内已自带补丁钩子（android.sh:218-220）与 16 个 perl 兜底处理器，且
# tools/patch/cmake/x265/CMakeLists.txt 已是打过 CMP0025 NEW 的状态 ⇒ **不需要**基线里
# 那两步「pre-download x265 patch」与「inject patch hook into android.sh」。
#
# ── 2026-09-19 排查与修复 ───────────────────────────────────────────────────────
# run #1 (e752c56) 死在步骤 8「Build」：android.sh 在第 17 分钟返回 1（完整 build.log
#   在那次 run 的 build-logs-1 artifact 里，需登录才能下载）。
# run #2 (036ae62) 更早死在步骤 4「Install build dependencies」—— 与 run #1 相比只多
#   了一个 --disable-lib-sdl，brew 包列表逐字相同，所以那不是改动引起的：
#   macos-14 已被 GitHub 标记 deprecated，Homebrew 也不再为它出 bottle ⇒ groff 的
#   依赖链退化成源码编译 ⇒ netpbm 要用 SVN 从 SourceForge 拉源码，而 runner 里没有
#   可用的 svn、DNS 也解析不了 svn.code.sf.net ⇒ 装依赖阶段就中止。
# 本次改动（一次只动一个变量）：
#   ① runner: macos-14 → macos-15（GA，Homebrew 有 bottle）——修掉步骤 4 的失败；
#   ② groff / gtk-doc / docbook-xsl 降为「可失败」：它们只服务 man page 与文档生成
#      （是从上游 apt 清单直译过来的），Android 的 .so 构建用不到，却能把
#      netpbm→SVN 这条死路拖进来；
#   ③ 构建输出 tee 到 ci-console.log，并把关键片段写进 Job Summary：artifact 需要
#      登录才能下载，而 run 页面匿名可读 ⇒ 失败原因能直接看到，不必再来一轮盲试；
#   ④ 新增 AAR 出厂验收 scripts/ci/verify-aar.py：禁止未弱化的 PLATFORM_ 孤儿符号
#      + 要求 64 位库 16KB 对齐。把「真机启动崩溃」那类问题挡在产物之前。
name: Publish Android AAR (full GPL LTS)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag for the GitHub Release (e.g. v6.0.0-full-gpl-lts). Leave empty to upload an artifact only.'
        required: false
        type: string
      include_armv7a:
        description: '是否同时构建 armeabi-v7a。**默认是** —— 应用侧 reactNativeArchitectures 就是 4 个 ABI，只有 3 个的 AAR 无法直接替换现役产物，必须改 App 配置。改为 false 可快速跑 3 ABI 验证（16KB 只约束 64 位，armeabi-v7a/x86 与它无关）。'
        required: false
        type: boolean
        default: true
      keep_going:
        description: '某个库失败时不中止，继续把剩余库跑完并汇总失败清单（默认开）。全量 52 个库里有 26 个从未构建过，关掉它就会「一轮只暴露一个库」。'
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-android-aar-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PATCH_ROOT: ${{ github.workspace }}
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  BASEDIR: ${{ github.workspace }}
  GIT_TERMINAL_PROMPT: "0"
  # Use Actions Node 24 for actions when available (quiet deprecation noise).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-publish:
    name: Build and publish ffmpeg-kit AAR (ubuntu-22.04, like upstream)
    # 选 ubuntu-22.04 而不是 ubuntu-24.04 的唯一理由是「与已被验证过能出整包的平台
    # 逐项一致」—— 24.04 的 GCC 13 会给一批 autotools 库带进新的 -Werror 警告，
    # 那是另一类变量，不该和这次迁移混在一起。
    # 若 22.04 退役，切 24.04 并预备处理 GCC 13 的新警告。
    runs-on: ubuntu-22.04
    # GitHub 托管 runner 的作业硬上限是 6 小时；留出写诊断与上传产物的余量。
    timeout-minutes: 350
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies (apt)
        run: |
          set -euo pipefail
          sudo apt-get update
          # 必装。逐项对应 android.sh 真正会调用的 host 工具：
          #   autoconf / automake / libtool(→libtoolize)  autotools 类库（最耗时的一批）
          #   nasm / yasm                                  x264 / x265 的汇编
          #   bison / autogen / gperf                      部分库的语法生成
          #   meson / ninja-build                          dav1d 等 meson 类库
          #   gettext / texinfo                            libiconv / makeinfo
          #   libtasn1-6-dev                               gnutls
          #   patch                                        patches/android-apply-patches.sh 要 GNU patch
          #   perl                                         下面「Match Gradle ndkVersion」用 perl -i -pe
          #   python3                                      scripts/ci/verify-aar.py
          #   curl / wget / unzip / git                    android.sh 下载与解包
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            curl wget git unzip \
            nasm yasm cmake make \
            bison autogen gperf meson ninja-build \
            gettext texinfo \
            libtasn1-6-dev perl python3 patch
          # 文档/手册工具链：只服务 man page 生成，构建 .so 用不到。在 ubuntu 上都是
          # 纯 apt 包（Mac 上曾把 groff → netpbm → SVN 拖成单点，run #2 挂在那里），
          # 保留「装不上就放行」只是为了不让它成为单点。
          sudo apt-get install -y groff gtk-doc-tools docbook-utils docbook-xsl \
            || echo "::warning::optional doc toolchain failed to install (continuing)"

      - name: Install Android command-line tools and SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          mkdir -p "${SDK_ROOT}/cmdline-tools"
          rm -rf "${SDK_ROOT}/cmdline-tools/latest" /tmp/android-clt
          CL_TOOLS_ZIP="/tmp/commandlinetools-linux.zip"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "${CL_TOOLS_ZIP}"
          unzip -q -o "${CL_TOOLS_ZIP}" -d /tmp/android-clt
          # Zip is either cmdline-tools/{bin,lib,...} or cmdline-tools/cmdline-tools/...
          if [[ -x /tmp/android-clt/cmdline-tools/bin/sdkmanager ]]; then
            mv /tmp/android-clt/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          elif [[ -x /tmp/android-clt/cmdline-tools/cmdline-tools/bin/sdkmanager ]]; then
            mv /tmp/android-clt/cmdline-tools/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          else
            echo "ERROR: sdkmanager not found after unzip; listing:" >&2
            find /tmp/android-clt -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          SDKM="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "${SDKM}" 2>/dev/null || true
          # pipefail + yes|sdkmanager: yes exits 141 on SIGPIPE when sdkmanager stops reading — disable pipefail here.
          set +o pipefail
          yes | "${SDKM}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null
          set -o pipefail
          "${SDKM}" --sdk_root="${SDK_ROOT}" --install \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Install Android NDK r27d (linux zip, same as the AAR we replace)
        run: |
          set -euo pipefail
          # ⚠️ 选 r27d 的唯一理由：**现役 AAR 就是 r27d 编的**（判据是产物里的 configure 串，
          #    见文件头）。换 NDK 版本等于同时换掉整套 clang 与 sysroot，是「一轮只动一个
          #    变量」原则下最不该顺手带上的改动。
          # ⚠️ **别按「新版才好支持 16KB」挑 NDK** —— 16KB 与本仓的 NDK 版本无关：本仓把
          #    max-page-size 写死在 LDFLAGS 里：
          #      scripts/function-android.sh:94   APP_LDFLAGS := "-Wl,-z,max-page-size=16384,--hash-style=both"
          #      scripts/function-android.sh:560  ... -Wl,-z,max-page-size=16384,--hash-style=both ...
          #    r27 的 64 位链接器默认 0x1000、r28 默认 0x4000，在这个 flag 面前没有差别。
          #    32 位的 libc++_shared.so（NDK 预编译仍是 4KB）另由
          #    scripts/android/relink-libcxx-16kb.sh 用 libc++_static.a + libc++abi.a 重链。
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip" -o /tmp/ndk.zip
          unzip -q -o /tmp/ndk.zip -d "${HOME}/ndk"
          NDK_DIR="${HOME}/ndk/android-ndk-r27d"
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"
          # ⚠️ 关键防御：上面三个变量只服务**构建脚本**（android.sh 靠它们选 toolchain）。
          #    但整轮最后一步的 Gradle 里，AGP 是按 **${ANDROID_SDK_ROOT}/ndk/<ndkVersion>**
          #    去找 NDK 的 —— 而我们把它解在 $HOME/ndk 下，两者错配。
          #    前 6 轮 CI 从未走到过 Gradle 那一步（都在库构建阶段就结束了），所以这个
          #    错配从未被暴露；上游那份 android-full-gpl-patched.yml 同样没处理它。
          #    这里把它链接进 SDK，让「Match Gradle ndkVersion」写进去的版本号一定能解析到。
          REV="$(awk -F'=' '/^Pkg\.Revision/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}' "${NDK_DIR}/source.properties")"
          echo "INFO: NDK Pkg.Revision = ${REV}"
          mkdir -p "${ANDROID_SDK_ROOT}/ndk"
          ln -sfn "${NDK_DIR}" "${ANDROID_SDK_ROOT}/ndk/${REV}"
          ls -l "${ANDROID_SDK_ROOT}/ndk/"
          test -f "${ANDROID_SDK_ROOT}/ndk/${REV}/source.properties"

      - name: Match Gradle ndkVersion to installed NDK
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_ROOT:-${HOME}/ndk/android-ndk-r27d}"
          if [[ ! -f "${NDK_ROOT}/source.properties" ]]; then
            echo "ERROR: ${NDK_ROOT}/source.properties not found" >&2
            ls -la "${NDK_ROOT}" >&2 || true
            exit 1
          fi
          # NDK r26+ uses Pkg.Revision (not plain Revision); piped grep can trip set -e.
          REV="$(awk -F'=' '/^Pkg\.Revision/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}' "${NDK_ROOT}/source.properties")"
          if [[ -z "${REV}" ]]; then
            REV="$(awk -F'=' '/^Revision=/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2; exit}' "${NDK_ROOT}/source.properties")"
          fi
          if [[ -z "${REV}" ]]; then
            echo "ERROR: could not parse NDK revision from source.properties" >&2
            cat "${NDK_ROOT}/source.properties" >&2
            exit 1
          fi
          echo "INFO: Gradle ndkVersion <- ${REV}"
          perl -i -pe "s/ndkVersion \"[^\"]*\"/ndkVersion \"${REV}\"/" tools/android/build.lts.gradle

      - name: Build full GPL LTS AAR (4 ABI, ubuntu-22.04)
        run: |
          set -uo pipefail
          chmod +x ./android.sh
          git fetch --tags --force || true
          echo "=== git describe (android.sh needs this) ==="
          git describe --tags --always || true
          echo "=== disk ==="
          df -h .

          # ABI 集合：**默认 4 个**（armeabi-v7a / arm64-v8a / x86 / x86_64）。
          # 这与 inputs.include_armv7a 的 default: true 是同一条判据的两处表述 ——
          # 改一处必须改另一处。只有把开关置 false 才是 3 个（arm64-v8a / x86 / x86_64）。
          # ⚠️ 应用侧 reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64，
          #    少一个 ABI ⇒ 32 位设备上 FFmpegKit 加载失败（与本次修的崩溃同源）。
          # ⚠️ 「**去掉** armeabi-v7a」必须两个都禁：android.sh 拼 ANDROID_ARCHITECTURES 处的判据是
          #    `ENABLED_ARCHITECTURES[ARCH_ARM_V7A] || ENABLED_ARCHITECTURES[ARCH_ARM_V7A_NEON]`，
          #    只写 --disable-arm-v7a 的话 armeabi-v7a 仍会进 APP_ABI ——
          #    之前那版「3 个 ABI」的承诺是假的（已实测确认）。
          #    「**保留** armeabi-v7a」时方向恰好相反：只禁 arm-v7a、留 neon（见下面的分支注释）。
          #    这两条别互相搬运 —— 一个是「或」判据要求全禁，一个是产物布局要求只留 neon。
          # ⚠️ --disable-lib-sdl **必须**。SDL2 的 joystick HIDAPI 会在 libavdevice.so
          #    里留下 17 个 PLATFORM_hid_* 未弱化的孤儿强符号（含 PLATFORM_hid_write）；
          #    那些库带 DT_FLAGS=BIND_NOW，符号在 dlopen 阶段就立即绑定 ⇒ 真机启动直接崩。
          #    现役那份 AAR 正是没关 SDL2 编出来的（上游 android-full-gpl-patched.yml
          #    同样没关），所以眼下要靠 FfmpegKitHidSymbolPatchPlugin.js 事后弱化符号绕。
          # ⚠️ --api-level=23 **必须**。LTS 默认 API=16，而 android.sh 的架构循环里：
          #      if (arm64-v8a || x86_64) && [[ ${ORIGINAL_API} -lt 21 ]]; then API=21
          #    也就是说只有 64 位被抬到 21、32 位留在 16 ⇒ 同一个「编译期 API 级别」
          #    在 32/64 位之间分裂。libpng 的 ZLIB_VERNUM 自校验与 libvpx 的
          #    `check_cflags = check_cc -Werror` 都是这么死的，另带 5 个库连坐。
          #    传 23 ⇒ ORIGINAL_API=23 ≥ 21 ⇒ 走 else 分支，4 个架构**统一 23**，
          #    与 clang wrapper 的 armv7a-linux-androideabi23-clang 完全一致。
          #    注意 23 仍 < 24 ⇒ bionic 的 __BIONIC_AVAILABILITY_GUARD(24) 依旧隐藏
          #    fseeko 的声明 ⇒ scripts/android/tiff.sh 里那两个 ac_cv_func_fseeko*=no
          #    仍然是必需的，别因为「API 提到 23」就把它删掉。
          # ⚠️ ⚠️ 这里**没有 `-d`** —— 这是本次纠正的第二处偏差。`android.sh:82` 的
          #    `-d | --debug` 不是「多点日志」，它做两件都很重的事：
          #      ① function-android.sh 的 get_cflags()/get_cxxflags() 是
          #         `OPTIMIZATION_FLAGS="${FFMPEG_KIT_DEBUG}"` —— **替换**语义，不是追加。
          #         于是 -Os / -O2 / -flto / -ffunction-sections / -fdata-sections 被
          #         一个 `-g` 整个顶掉，等于 -O0；这正好落在 libavcodec/libavfilter/
          #         swscale 的 C 热路径上。
          #      ② scripts/android/ffmpeg.sh:358-366 会翻到
          #         `--enable-debug --disable-stripping`（不传 `-d` 才是
          #         `--disable-debug --enable-lto`）。
          #    判据来自产物、不是推测：现役 AAR 的 configure 串里是
          #    `--disable-debug --enable-lto` ⇒ 它**没有**用 `-d` 编。上游自己的 full
          #    构建（periodic-builds-android.yml）同样不传 `-d`。之前传 `-d` 是从那份
          #    对不上的基线（r28b + -d）继承来的。
          #
          # ⚠️ 同样**不要**顺手加 `--disable-lib-srt`（上游 periodic-builds-android.yml
          #    就是这么写的，看起来很权威）：x86 上 openssl 会 `return 200`
          #    （scripts/android/openssl.sh:7，语义是「本架构不支持」这条**永久**事实，
          #    不是一次失败），scripts/main-android.sh:200-217 据此只标 UNSUPPORTED_ 而
          #    **刻意不设 OK_**（否则 srt 会在 x86 上被强行构建、必然死在 find_package(OpenSSL)），
          #    于是依赖它的 srt 在 x86 上自然缺席；arm64-v8a / armeabi-v7a / x86_64 三个
          #    ABI 上 srt 照常有（现役 AAR 的 x86 configure 串里也确实有 --enable-libsrt，
          #    因为 ENABLED_LIBRARIES 是开始时就定下的列表）。加 --disable-lib-srt 会让
          #    **四个** ABI 一起失去 srt —— 那是绕过症状而不是修复。
          FLAGS=(--lts --full --enable-gpl --disable-lib-sdl \
                 --enable-android-media-codec --enable-android-zlib \
                 --api-level=23)
          if [[ "${{ github.event.inputs.include_armv7a }}" == "true" ]]; then
            ABIS="armeabi-v7a arm64-v8a x86 x86_64"
            # ⚠️ 只关 arm-v7a、**保留 arm-v7a-neon** —— 这才是 armeabi-v7a 那一格的正确来源。
            #    两个都开（即什么都不加）是错的，两重代价：
            #      ① 多跑一整个 arm-v7a pass（5 个 pass 而非 4 个）；
            #      ② android/jni/Android.mk:97 的判据是 `MY_ARMV7_NEON && !MY_ARMV7`
            #         才把 MY_BUILD_GENERIC_FFMPEG_KIT 置 false。两个 marker 都在时它保持 true
            #         ⇒ 除 7 个 *_neon.so 外还会多建 plain libav*.so ×7 + libffmpegkit.so
            #         ⇒ armeabi-v7a 变成 18 个 .so 而不是 10 个。
            #    只留 neon 时：`.armv7neon` 在、`.armv7` 不在 ⇒ 恰好 10 个
            #      （7 个 *_neon.so + libc++_shared.so + libffmpegkit_abidetect.so
            #        + libffmpegkit_armv7a_neon.so），与现役那份 AAR 的 armeabi-v7a 逐项一致。
            FLAGS+=(--disable-arm-v7a)
          else
            ABIS="arm64-v8a x86 x86_64"
            FLAGS+=(--disable-arm-v7a --disable-arm-v7a-neon)
            echo "::warning::include_armv7a=false → AAR 只有 3 个 ABI，不能直接替换 4 ABI 的应用"
          fi

          # keep-going：一个库失败不再终止整轮，跑完剩余库后一次性列出失败清单
          # （main-android.sh 会打印 `KEEP_GOING_FAILED_LIBRARIES: ...`）。
          # 默认开：目前 52 个库里只有 22 个被验证过，关掉就是「一轮只暴露一个库」。
          if [[ "${{ github.event.inputs.keep_going }}" == "true" ]]; then
            export FFMPEG_KIT_KEEP_GOING=1
            echo "keep_going=yes → 库失败不中止，末尾汇总失败清单"
          fi

          echo "BUILD_ABIS=${ABIS}" >> "$GITHUB_ENV"
          echo "BUILD_CMD=android.sh ${FLAGS[*]}" >> "$GITHUB_ENV"
          echo "=== android.sh ${FLAGS[*]} ==="

          # 2>&1 | tee：既保留实时输出，又留下可供 Job Summary 引用的副本。
          # （android.sh 第 218-221 行调用 patches/android-apply-patches.sh 时没有重定向，
          #   它的输出只走控制台 —— 而它正是最可能的失败点。）
          set +e
          bash ./android.sh "${FLAGS[@]}" 2>&1 | tee ci-console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "BUILD_RC=${rc}" >> "$GITHUB_ENV"
          echo "android.sh exit code = ${rc}"
          if [[ "${rc}" -ne 0 ]]; then
            exit "${rc}"
          fi

      - name: Stage release asset
        id: stage
        run: |
          set -euo pipefail
          AAR_PATH="$(find prebuilt -type f -name 'ffmpeg-kit.aar' -print -quit)"
          if [[ -z "${AAR_PATH}" ]] || [[ ! -f "${AAR_PATH}" ]]; then
            echo "ERROR: ffmpeg-kit.aar not found under prebuilt/" >&2
            exit 1
          fi
          mkdir -p release-assets
          DEST="release-assets/ffmpeg-kit-full-gpl-lts-${{ github.run_number }}-${{ github.sha }}.aar"
          cp "${AAR_PATH}" "${DEST}"
          echo "aar_path=${DEST}" >> "$GITHUB_OUTPUT"
          ls -lh release-assets/
          sha256sum release-assets/*.aar

      # 出厂验收：不合格就让作业红掉，别把一个会在真机 dlopen 阶段崩的包放出去。
      # --expect-abis 直传上面算出来的 BUILD_ABIS —— 让「声明要构建的 ABI」与
      # 「产物里实际有的 ABI」成为同一个判据，而不是两处各说各话
      # （上一版「3 个 ABI」的承诺就是假的，没人查过产物）。
      - name: Verify AAR (no orphan PLATFORM_ symbols · 16KB alignment · ABI set)
        run: |
          set -uo pipefail
          set +e
          python3 scripts/ci/verify-aar.py \
            "release-assets/ffmpeg-kit-full-gpl-lts-${{ github.run_number }}-${{ github.sha }}.aar" \
            --prefix PLATFORM_ --require-16k \
            --expect-abis "${BUILD_ABIS:-}" 2>&1 | tee ci-verify.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "${rc}"

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-full-gpl-lts-aar-${{ github.run_number }}
          path: release-assets/*.aar
          if-no-files-found: warn

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: FFmpegKit Android ${{ github.event.inputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 关键：run 页面匿名可读，而 artifact 需要登录才能下载。
      # 所以把「为什么失败」直接写进 Job Summary —— 否则每轮只能盲试。
      - name: Write diagnostics to Job Summary
        if: always()
        run: |
          S="$GITHUB_STEP_SUMMARY"
          AAR_PATH="$(ls release-assets/*.aar 2>/dev/null | head -1 || true)"
          {
            echo "## ffmpeg-kit AAR — 诊断"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| runner | \`${{ runner.os }} / ${{ runner.arch }}\` |"
            echo "| android.sh 退出码 | \`${BUILD_RC:-未执行}\` |"
            echo "| 构建 ABI | \`${BUILD_ABIS:-?}\` |"
            echo "| 命令 | \`${BUILD_CMD:-?}\` |"
            if [[ -n "${AAR_PATH}" ]]; then
              echo "| AAR | \`$(basename "${AAR_PATH}")\` · $(du -h "${AAR_PATH}" | cut -f1) · sha256 \`$(sha256sum "${AAR_PATH}" | cut -c1-16)…\` |"
            else
              echo "| AAR | ❌ 未产出 |"
            fi
            echo
            if [[ -f ci-console.log ]]; then
              if grep -q 'All patches applied successfully' ci-console.log; then
                echo "- ✅ 补丁阶段完成（\`All patches applied successfully\`）"
              else
                echo "- ⚠️ **补丁阶段未完成** —— 失败点很可能在 \`patches/android-apply-patches.sh\`；该脚本里 \`apply_ffmpeg_dual_tls\` 与 \`apply_x264_android_osdep_lfs\` 是唯二**没有回退**的硬失败（其余每一处都有 perl/python 兜底），这种不对称很可疑。"
              fi
              # keep-going 汇总 —— 这是本轮 CI 最重要的输出：一次列出所有失败的库。
              # 没有它，每轮只会暴露一个库，26 个未验证的库就要 26 轮。
              if grep -q 'KEEP_GOING_FAILED_LIBRARIES' ci-console.log; then
                echo
                echo "### ⛔ 本轮失败的库（keep-going 汇总）"
                echo
                echo '```'
                grep -h 'KEEP_GOING_FAILED_LIBRARIES' ci-console.log | tail -1
                echo '```'
                echo
                echo "未列出的库均已 \`ok\`。逐个修掉后重跑即可收敛。"
                echo
              fi
              if grep -q 'Creating Android archive under prebuilt' ci-console.log; then
                echo "- ✅ 走到了打包 AAR 阶段"
              else
                echo "- ℹ️ 未走到「Creating Android archive」"
              fi
              echo
              echo "<details><summary>ci-console.log 里的错误行（最多 60 行）</summary>"
              echo
              echo '```'
              grep -n -iE 'error|fatal|cannot|No such file|not found|failed|could not' ci-console.log | tail -n 60 || true
              echo '```'
              echo
              echo "</details>"
              echo
              echo "<details><summary>ci-console.log 末尾 120 行</summary>"
              echo
              echo '```'
              tail -n 120 ci-console.log
              echo '```'
              echo
              echo "</details>"
            else
              echo "- ⚠️ 没有 ci-console.log（构建步骤未执行到）"
            fi
            if [[ -f ci-verify.log ]]; then
              echo
              echo "### AAR 验收结果"
              echo
              echo '```'
              cat ci-verify.log
              echo '```'
            fi
          } >> "$S"

          # build.log / config.log 可能很大，单独放
          {
            if [[ -f build.log ]]; then
              echo
              echo "<details><summary>build.log 末尾 150 行</summary>"
              echo
              echo '```'
              tail -n 150 build.log
              echo '```'
              echo
              echo "</details>"
            fi
            if [[ -f src/ffmpeg/ffbuild/config.log ]]; then
              echo
              echo "<details><summary>src/ffmpeg/ffbuild/config.log 末尾 80 行</summary>"
              echo
              echo '```'
              tail -n 80 src/ffmpeg/ffbuild/config.log
              echo '```'
              echo
              echo "</details>"
            fi
            echo
            echo "---"
            echo "完整日志见 artifact \`build-logs-${{ github.run_number }}\`（下载需登录）。"
          } >> "$S"

      - name: Upload build logs (on failure or always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            build.log
            ci-console.log
            ci-verify.log
            src/ffmpeg/ffbuild/config.log
          if-no-files-found: ignore
